[project]
name = "trajectory-os"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michel836", email = "183355836+Michel836@users.noreply.github.com" }
]
requires-python = ">=3.13.15"
dependencies = [
    "duckdb>=1.5.5",
    "networkx>=3.6.1",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
trajectory-os = "trajectory_os.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
